name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".git*"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: scuad-frontend

jobs:
  # ----------------------------
  # 1. Build & Push Docker Image
  # ----------------------------
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AWS Credentials 설정
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # AWS ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 브랜치별 Parameter Store 경로 결정
      - name: Set config
        id: config
        run: |
          BRANCH="${{ github.base_ref || github.ref_name }}"
          if [[ "$BRANCH" == release/* ]]; then
            echo "ssm_env_path=/staging/fe/DOT_ENV" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" == "main" ]; then
            echo "ssm_env_path=/prod/fe/DOT_ENV" >> $GITHUB_OUTPUT
          else
            echo "ssm_env_path=/dev/fe/DOT_ENV" >> $GITHUB_OUTPUT
          fi
          echo "tag_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Parameter Store에서 .env 가져오기
      - name: Fetch .env from Parameter Store
        run: |
          aws ssm get-parameter \
            --name "${{ steps.config.outputs.ssm_env_path }}" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text > .env

      # Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # runtime 이미지 빌드 및 push
      - name: Build and push runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.config.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------
  # 2. Test & Static Analysis
  # ----------------------------
  test_and_lint:
    name: Test & Static Analysis
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.base_ref == 'develop' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'develop')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Integration tests
        run: npm run test:integration
        continue-on-error: true